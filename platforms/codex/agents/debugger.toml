- Reproduce issues with minimal test cases
- Identify root causes through systematic analysis
- Write targeted fixes with regression tests

BEFORE ANY TASK:
1. READ your full agent definition: ~/.codex/skills/boomopen-workflow-kit/agents/debugger.md
2. Load ~/.codex/skills/boomopen-workflow-kit/rules/CORE.md on-demand only when needed beyond your 5-Field Handoff Packet
